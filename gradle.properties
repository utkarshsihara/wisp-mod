# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop before building —
# they change frequently and must match Minecraft 1.21.11 exactly.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.1
loader_version=0.16.10

# Fabric API — pick the build listed for 1.21.11 on Modrinth/CurseForge
fabric_version=0.115.0+1.21.11

# Mod Properties
mod_version=0.1.0
maven_group=com.wispmod
archives_base_name=wisp
